name: tests

on:
  push:
    branches:
      - main
      - dev
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ${{ github.event_name == 'push' && github.ref_protected && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') && vars.DFAIR_ARC_TRUSTED_PUSH == 'true' && 'dfair-gha-runner-arc' || 'ubuntu-latest' }}

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0

      - name: Install Python
        run: uv python install 3.11

      - name: Show Python
        run: uv python find 3.11

      - name: Sync dependencies
        run: uv sync --frozen --python 3.11 --group torch

      - name: Run tests + coverage (skip slow)
        run: uv run --python 3.11 pytest -m "not slow" --cov=src --cov-report=term-missing --cov-report=xml
