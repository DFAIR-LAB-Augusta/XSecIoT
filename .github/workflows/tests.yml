name: tests

on:
  push:
    branches:
      - main
      - FIRCE-MC
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: [self-hosted, dfair-gha-runner]

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v9.0.0

      - name: Install Python
        run: uv python install 3.11

      - name: Show Python
        run: uv python find 3.11

      - name: Sync dependencies
        run: uv sync --frozen --python 3.11 --group torch

      - name: Run tests + coverage (skip slow)
        run: uv run --python 3.11 pytest -m "not slow" --cov=src --cov-report=term-missing --cov-report=xml
