[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/fire", "src/firce"]
sources = ["src"]

[project]
name = "xseciot"
version = "1.0.3"
description = "Machine learning-based IoT intrusion detection with explainable AI and conformal evaluation."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "Unlicense"
license-files = ["LICEN[CS]E*"]

authors = [
  { name = "Seth Barrett", email = "sebarrett@augusta.edu" },
  { name = "Bradley Boswell", email = "brboswell@augusta.edu" },
  { name = "Swarnamugi Rajaganapathy", email = "swarnamugi@dfairlab.com" },
  { name = "Lin Li", email = "lli1@augusta.edu" },
  { name = "Gokila Dorai", email = "gdorai@augusta.edu" }
]

maintainers = [
  { name = "Seth Barrett", email = "sebarrett@augusta.edu" }
]

keywords = [
  "iot",
  "intrusion detection",
  "cybersecurity",
  "machine learning",
  "xai",
  "explainable ai",
  "concept drift",
  "conformal evaluation",
  "firce"
]

classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: The Unlicense (Unlicense)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Security",
  "Topic :: System :: Networking :: Monitoring"
]

dependencies = [
    "dask==2026.3.0",
    "joblib==1.5.3",
    "lime==0.2.0.1",
    "matplotlib==3.10.8",
    "numpy==2.1.3",
    "pandas==3.0.1",
    "scikit-learn==1.8.0",
    "scipy==1.15.3",
    "shap==0.47.2",
    "shortuuid==1.0.13",
    "toml==0.10.2",
    "tqdm==4.67.3",
    "xgboost==3.2.0",
    "pydantic==2.11.9",
    "pyarrow==23.0.1",
]

[project.urls]
Homepage = "https://github.com/DFAIR-LAB-Augusta/XSecIoT"
Repository = "https://github.com/DFAIR-LAB-Augusta/XSecIoT"
Issues = "https://github.com/DFAIR-LAB-Augusta/XSecIoT/issues"
Lab = "https://github.com/DFAIR-LAB-Augusta"

[dependency-groups]
dev = [
    "deptry==0.25.1",
    "pytest==8.3.5",
    "pytest-cov==6.0.0",
    "ruff==0.15.8",
    "twine==6.2.0",
]

torch = [
    "torch==2.10.0",
]

tensorflow = [
    "tensorflow[and-cuda]==2.19.1; sys_platform == 'linux'",
    "tensorflow==2.19.1; sys_platform == 'darwin'",
]

cade = [
    "cade-firce==0.4.2"
]

lambda-torch = [
    { include-group = "torch" },
    { include-group = "cade" },
]

lambda-tensorflow = [
    { include-group = "tensorflow" },
    { include-group = "cade" },
]

[tool.uv]
default-groups = ["dev"]
package = true
conflicts = [
    [
        { group = "tensorflow" },
        { group = "torch" },
    ],
]

[project.scripts]
firce = "firce.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=src --cov-report=term-missing --cov-report=html"

[tool.deptry]
root = ["src"]

[tool.deptry.per_rule_ignores]
DEP001 = ['cade']
DEP002 = ["pyarrow"] # Used in dask
DEP003 = ["fire", "firce"]
DEP004 = ['torch', 'cade', 'tensorflow']